name: KHALID DOWNLOADER

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public media URL you own or are authorized to save
        required: true
        type: string
      verify_r2_link:
        description: Smoke-test a guarded download with HEAD and one-byte Range
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Ensure media tools are available for playback checks
        run: |
          packages=()
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if ! command -v exiftool >/dev/null 2>&1; then
            packages+=(libimage-exiftool-perl)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          ffmpeg -version
          ffprobe -version
          exiftool -ver
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download original and deliver through Telegram or R2 link
        env:
          VIDEO_URL: ${{ inputs.url }}
          VERIFY_R2_LINK: ${{ inputs.verify_r2_link }}
          PYTHONUNBUFFERED: "1"
          RESOURCE_API_URL: https://khalid-downloader-api.kkoo98767.workers.dev
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m app.main
