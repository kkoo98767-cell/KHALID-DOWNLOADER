name: KHALID DOWNLOADER

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public media URL you own or are authorized to save
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Cache official Telegram Bot API server
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/telegram-bot-api-install
          key: telegram-bot-api-${{ runner.os }}-7232881b39dfcd048a0d569f1983c5184249ee05
      - name: Start official local Telegram Bot API when configured
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [[ -z "$TELEGRAM_API_ID" && -z "$TELEGRAM_API_HASH" ]]; then
            echo "TELEGRAM_API_URL=https://api.telegram.org" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "$TELEGRAM_API_ID" || -z "$TELEGRAM_API_HASH" ]]; then
            echo "Set both TELEGRAM_API_ID and TELEGRAM_API_HASH secrets, or leave both empty." >&2
            exit 1
          fi

          install_dir="$RUNNER_TEMP/telegram-bot-api-install"
          if [[ ! -x "$install_dir/bin/telegram-bot-api" ]]; then
            sudo apt-get update
            sudo apt-get install -y cmake g++ gperf git libssl-dev zlib1g-dev
            source_dir="$RUNNER_TEMP/telegram-bot-api-source"
            git init "$source_dir"
            git -C "$source_dir" remote add origin https://github.com/tdlib/telegram-bot-api.git
            git -C "$source_dir" fetch --depth=1 origin 7232881b39dfcd048a0d569f1983c5184249ee05
            git -C "$source_dir" checkout --detach FETCH_HEAD
            git -C "$source_dir" submodule update --init --recursive --depth 1
            cmake -S "$source_dir" -B "$source_dir/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$install_dir"
            cmake --build "$source_dir/build" --target install --parallel 2
          fi

          mkdir -p "$RUNNER_TEMP/telegram-bot-api-data" "$RUNNER_TEMP/telegram-bot-api-temp"
          env TELEGRAM_API_ID="$TELEGRAM_API_ID" TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            nohup "$install_dir/bin/telegram-bot-api" \
              --local --http-port=8081 \
              --dir="$RUNNER_TEMP/telegram-bot-api-data" \
              --temp-dir="$RUNNER_TEMP/telegram-bot-api-temp" \
              > "$RUNNER_TEMP/telegram-bot-api.log" 2>&1 &
          ready=false
          for attempt in {1..45}; do
            if curl --silent --show-error --fail --max-time 3 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            cat "$RUNNER_TEMP/telegram-bot-api.log"
            echo "Local Telegram Bot API did not become ready." >&2
            exit 1
          fi
          echo "TELEGRAM_API_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
      - name: Download and send original file to Telegram
        env:
          VIDEO_URL: ${{ inputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.main
      - name: Log out bot from local Telegram API
        if: always()
        env:
          TELEGRAM_API_URL: ${{ env.TELEGRAM_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [[ "$TELEGRAM_API_URL" == "http://127.0.0.1:8081" && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            curl --silent --show-error --max-time 20 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/logOut" >/dev/null || true
          fi
